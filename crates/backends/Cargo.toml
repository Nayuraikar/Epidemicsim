[package]
name = "epidemicsim-backends"
version.workspace = true
edition.workspace = true

[features]
# NVIDIA GPU backend (cudarc, loaded at run time: building needs no CUDA toolkit).
cuda = ["dep:cudarc"]

[dependencies]
epidemicsim-core = { version = "0.1.0", path = "../core" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
epidemicsim-kernels-c = { version = "0.1.0", path = "../kernels-c" }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"

[dependencies.cudarc]
version = "0.19.10"
optional = true
default-features = false
features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12040"]
