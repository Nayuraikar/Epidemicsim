[package]
name = "epidemicsim-server"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
epidemicsim-backends = { version = "0.1.0", path = "../backends" }
epidemicsim-core = { version = "0.1.0", path = "../core" }
epidemicsim-data = { version = "0.1.0", path = "../data" }
epidemicsim-scenarios = { version = "0.1.0", path = "../scenarios" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
